name: Tasks
options:
  bundleIdPrefix: io.github.andym129
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  # 本地包，稳定后拆成独立仓库供其他 App 复用
  ToastKit:
    path: Packages/ToastKit
  # 崩溃与主线程卡顿监控，报告存本地，由「问题反馈」打包随邮件发给作者
  KSCrash:
    url: https://github.com/kstenerud/KSCrash.git
    exactVersion: 2.6.1
targets:
  Tasks:
    type: application
    platform: macOS
    sources:
      - path: Tasks
    dependencies:
      - package: ToastKit
      - package: KSCrash
        product: Recording
    info:
      path: Tasks/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: $(APP_DISPLAY_NAME) 需要读取和编辑你的日历日程。
    entitlements:
      path: Tasks/Tasks.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        # 检查更新要访问 GitHub API
        com.apple.security.network.client: true
        # 用户设置存到 ~/.config/CalendarTasks/，卸载重装、换机后可复用
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /.config/CalendarTasks/
        # 启动时读系统为本 App 生成的崩溃报告，复制到 ~/.config/CalendarTasks/crashes/
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Logs/DiagnosticReports/
    settings:
      base:
        # 模块名固定为 Tasks（产物名按配置区分，含连字符不能作模块名）
        PRODUCT_MODULE_NAME: Tasks
        MARKETING_VERSION: 0.3.3
        CURRENT_PROJECT_VERSION: 3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        # 固定证书签名：重新编译后日历授权（TCC）不失效
        DEVELOPMENT_TEAM: 9X349G8KD4
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: andy_m129@163.com (VRLXD5P3P7)"
      # 开发版（Debug）与正式版（Release）用不同的 .app 名、显示名和 Bundle ID，可同时装在本机
      configs:
        Debug:
          PRODUCT_NAME: CalendarTasks-Dev
          APP_DISPLAY_NAME: CalendarTasks-Dev
          PRODUCT_BUNDLE_IDENTIFIER: io.github.andym129.dev.calendar-tasks
        Release:
          PRODUCT_NAME: CalendarTasks
          APP_DISPLAY_NAME: CalendarTasks
          PRODUCT_BUNDLE_IDENTIFIER: io.github.andym129.calendar-tasks
