# 推送 v* tag 构建正式版 Release；手动触发构建测试版预发布。做法说明见 ifsd skill references/platforms/github.md 阶段 F。
name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "测试版版本号（可选，留空则用 project.yml 默认值）"
        required: false
        default: ""

# 创建 Release、上传产物需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # 计算渠道、版本号与 Release tag
      - name: Resolve build metadata
        id: meta
        run: |
          SHA="$(git rev-parse --short HEAD)"
          TS="$(date +%Y%m%d%H%M%S)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CHANNEL="stable"
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            PRERELEASE="false"
          else
            CHANNEL="beta"
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="$(grep 'MARKETING_VERSION' project.yml | head -1 | sed 's/.*: *//' | tr -d ' ')"
            fi
            TAG="v${VERSION}-beta-${SHA}-${TS}"
            PRERELEASE="true"
          fi
          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Package DMG
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          MARKETING_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          LABEL: ${{ steps.meta.outputs.tag }}
        run: ./scripts/package-dmg.sh

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            .build/dist/*-${{ steps.meta.outputs.tag }}.dmg
            .build/dist/*-${{ steps.meta.outputs.tag }}.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
