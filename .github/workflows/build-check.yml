# 推送到 master 与开发分支时只编译 Release（不签名、不打包、不发版），在打 tag 之前发现 Release 编不过的问题。
# 发版仍由 build-release.yml 负责。
name: Build Check

on:
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
      - "chore/**"
    paths-ignore:
      - "**.md"
      - "References/**"
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时只保留最新一次，省 macOS 运行分钟数（私有仓库按 10 倍计费）
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # 与 package-dmg.sh 相同的配置与架构，但不签名：只验证能否编过
      - name: Build Release
        run: |
          xcodegen generate
          xcodebuild -project Tasks.xcodeproj -scheme Tasks -configuration Release \
            -derivedDataPath .build/DerivedData -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet build
